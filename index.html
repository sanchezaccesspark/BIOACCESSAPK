<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BioAccess</title>

<style>
body {
    margin:0;
    background: linear-gradient(135deg,#0f172a,#020617);
    color:white;
    font-family: Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.card {
    background:#1e293b;
    padding:25px;
    border-radius:20px;
    text-align:left;
    box-shadow:0 0 40px rgba(0,0,0,0.6);
    width:100%;
    max-width:400px;
}

h1 {
    text-align:center;
}

.btn {
    display:block;
    margin-top:20px;
    padding:15px;
    background:#22c55e;
    border-radius:10px;
    text-decoration:none;
    color:white;
    font-size:18px;
    text-align:center;
}

.steps {
    margin-top:20px;
    font-size:14px;
    color:#cbd5f5;
}

.steps li {
    margin-bottom:8px;
}
</style>
</head>

<body>

<div class="card">
    <h1>🔐 BioAccess</h1>

    <a class="btn" href="https://drive.google.com/file/d/1XM3UqGgdsvzXokEri2VqizNV9nWWDaWY/view?usp=drive_link">
        Descargar APK
    </a>

    <ul class="steps">
        <li>1. Descarga el archivo APK</li>
        <li>2. Escoge el instalador</li>
        <li>3. Si aparece bloqueo, toca "Permitir desde esta fuente"</li>
        <li>4. Regresa y presiona "Instalar"</li>
        <li>5. Más detalles e nstalar sin analizar</li>
    </ul>

    <p style="font-size:12px;color:#94a3b8;">
        ⚠️ Android puede mostrar advertencias porque no viene de Play Store.
    </p>
</div>

</body>
</html>
